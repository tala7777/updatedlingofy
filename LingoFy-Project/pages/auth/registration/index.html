<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LingoFy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 align-items-center justify-content-center">
            <!-- Image Column -->
            <div class="col-lg-6 d-none d-lg-block text-center pe-lg-5">
                <img src="../../../assets/img/registration_illustration.png" alt="Registration Illustration"
                    class="img-fluid rounded-4 shadow-sm" style="max-height: 500px;">
            </div>

            <!-- Registration Column -->
            <div class="col-lg-6 col-xl-5 col-md-10">
                <div class="register-card card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-primary" style="font-size: 3rem;"></i>
                            <h2 class="mt-3 fw-bold">Create Account</h2>
                            <p class="text-muted">Join LingoFy to start your learning journey</p>
                        </div>

                        <form id="registerForm" novalidate>
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                                </div>
                                <div class="invalid-feedback d-none">
                                    <i class="bi bi-exclamation-circle me-1"></i>Please enter your full name
                                </div>
                            </div>

                            <!-- Email/Username -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email/Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="text" class="form-control" id="email" name="email" required>
                                </div>
                                <div class="invalid-feedback d-none">
                                    <i class="bi bi-exclamation-circle me-1"></i>Please enter a valid email or username
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required>

                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div id="passwordFeedback" style="margin-top: 5px; font-size: 0.875rem;"></div>
                                <div class="invalid-feedback d-none">
                                    <i class="bi bi-exclamation-circle me-1"></i>Password must meet the requirements
                                </div>
                            </div>

                            <!-- Role -->
                            <div class="mb-4">
                                <label for="role" class="form-label fw-semibold">Role</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                    <select class="form-select" id="role" name="role" required>
                                        <option value="">Select your role</option>
                                        <option value="student">Student</option>
                                        <option value="admin">Admin</option>
                                    </select>
                                </div>
                                <div class="invalid-feedback d-none">
                                    <i class="bi bi-exclamation-circle me-1"></i>Please select a role
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                <i class="bi bi-person-plus me-2"></i>Create Account
                            </button>

                            <div class="text-center">
                                <p class="text-muted mb-0">Already have an account? <a href="../login/index.html"
                                        class="text-primary fw-semibold">Login</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/seed.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
