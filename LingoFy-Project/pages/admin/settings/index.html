<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - LingoFy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../assets/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="../dashboard/index.html">
                <i class="bi bi-shield-lock me-2"></i>
                <span class="fw-bold">Admin Panel</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../dashboard/index.html">Dashbord</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../students/index.html">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../../auth/login/index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="fw-bold mb-4"><i class="bi bi-gear me-2"></i>System Settings</h2>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">General Settings</h5>
                        <div class="mb-3">
                            <label class="form-label">Site Name</label>
                            <input type="text" class="form-control" value="LingoFy" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Admin Email</label>
                            <input type="email" class="form-control" value="admin@lingofy.com" disabled>
                        </div>
                        <button class="btn btn-primary"
                            onclick="Swal.fire('Info', 'Settings saved! (Simulation)', 'success')">Save Changes</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 text-center">
                        <i class="bi bi-info-circle text-muted mb-3" style="font-size: 3rem;"></i>
                        <h5 class="fw-bold mb-2">About LingoFy</h5>
                        <p class="text-muted">Version 1.0.0<br>Designed for efficient language learning and assessment.
                        </p>
                        <hr>
                        <p class="small text-muted">© 2026 LingoFy Team</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
